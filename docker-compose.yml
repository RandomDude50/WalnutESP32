services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"        # in produzione: 8883 con TLS (vedi mosquitto.conf)
    volumes:
      - ./mosquitto:/mosquitto/config
      - mosquitto-data:/mosquitto/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      - mosquitto
    volumes:
      - artifacts:/data/artifacts
    expose:
      - "3000"
    # La compilazione esegue toolchain su input utente: limita le risorse.
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - backend

volumes:
  mosquitto-data:
  artifacts:
  caddy-data:
