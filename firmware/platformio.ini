[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; min_spiffs = 2 slot OTA da ~1.9 MB ciascuno (default.csv ne ha da 1.2 MB)
board_build.partitions = min_spiffs.csv
build_flags =
    -Iinclude
    -DCORE_DEBUG_LEVEL=1
extra_scripts = pre:scripts/configure.py
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
